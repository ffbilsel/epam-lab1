<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <form class="card" id="form">
    <h1>Reset password</h1>

    <label for="token">Reset token</label>
    <input id="token" name="token" required />

    <label for="newPassword">New password</label>
    <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required />
    <div class="strength"><div id="bar"></div></div>
    <div class="hint" id="hint">Use 8+ chars with upper, lower, number, symbol.</div>

    <label for="confirm">Confirm new password</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" required />

    <button type="submit">Reset password</button>
    <div class="msg" id="msg" style="display:none"></div>
    <div class="links"><a href="/login.html">Back to login</a></div>
  </form>

  <script src="/app.js"></script>
  <script>
    const { api, showMsg, clearMsg, bindStrengthMeter } = window.AuthClient;
    bindStrengthMeter(
      document.getElementById('newPassword'),
      document.getElementById('bar'),
      document.getElementById('hint')
    );

    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMsg(msg);
      const fd = new FormData(form);
      const newPassword = fd.get('newPassword');
      if (newPassword !== fd.get('confirm')) {
        return showMsg(msg, 'Passwords do not match.');
      }
      try {
        await api('/api/auth/reset-password', {
          method: 'POST',
          body: { token: fd.get('token'), newPassword },
        });
        showMsg(msg, 'Password reset. You can now sign in.', 'ok');
        setTimeout(() => (location.href = '/login.html'), 1500);
      } catch (err) {
        showMsg(msg, err.message);
      }
    });
  </script>
</body>
</html>
